<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Marlon Lotici | Live Loop Experience</title>
  <meta name="description" content="Marlon Lotici — Live Loop Experience: a pressão de uma banda, a logística de um artista solo. Vote no próximo bloco ou contrate para o seu evento em Florianópolis.">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" href="imagens/favicon-16x16.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] } } } };
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { background: #0A0A0A; color: #9ca3af; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    h1, h2, h3 { letter-spacing: -0.025em; }
    .tap { min-height: 44px; min-width: 44px; transition: transform .15s, background-color .25s, border-color .25s, opacity .25s; }
    .tap:active { transform: scale(.96); }
    .card { background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(12px); border-radius: 1.25rem; transition: border-color .3s, background-color .3s, box-shadow .3s; }
    .card:hover { border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.035); }
    .glow-emerald:hover { box-shadow: 0 0 40px -12px rgba(16,185,129,.35); }
    .glow-amber:hover { box-shadow: 0 0 40px -12px rgba(251,191,36,.3); }
    .rise { opacity: 0; transform: translateY(12px); animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    .settled #blocks .rise { animation: none; opacity: 1; transform: none; } /* não reanima a lista a cada voto/busca */
    .ghost { position: absolute; right: .75rem; top: -.5rem; font-size: 7rem; line-height: 1; font-weight: 900; letter-spacing: -.06em; color: rgba(255,255,255,.04); pointer-events: none; user-select: none; }
    .ping-ring { animation: ping-ring 2s cubic-bezier(0,0,.2,1) infinite; }
    @keyframes ping-ring { 75%, 100% { transform: scale(1.5); opacity: 0; } }
    .live-dot { animation: blink 1.4s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    .field { width: 100%; min-height: 48px; background: transparent; border: 0; border-bottom: 1px solid rgba(255,255,255,.2); color: #fff; outline: none; padding: .5rem 0; transition: border-color .25s; }
    .field:focus { border-color: #fff; }
    select.field option { background: #111; }
    input, textarea, select { font-size: 16px; }
    ::placeholder { color: #6b7280; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .rise { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
