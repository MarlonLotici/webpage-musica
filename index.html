<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Marlon Lotici | Live Loop Experience</title>
  <meta name="description" content="Marlon Lotici — Live Loop Experience: o impacto de uma banda completa, a versatilidade de um artista solo. Vote no próximo bloco ou contrate para o seu evento em Florianópolis.">
  <meta name="theme-color" content="#0B0F19">
  <link rel="icon" href="imagens/favicon-16x16.ico" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { amber: { DEFAULT: "#F59E0B" }, teal: { DEFAULT: "#10B981" } } } } };
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { background: linear-gradient(180deg, #0B0F19, #111827); min-height: 100vh; color: #e5e7eb; -webkit-tap-highlight-color: transparent; }
    .glass { backdrop-filter: blur(12px); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
    .tap { min-height: 44px; min-width: 44px; transition: transform .15s, background .2s, opacity .2s; }
    .tap:active { transform: scale(.96); }
    .view { animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .live-dot { animation: pulse 1.4s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    input, textarea, select { font-size: 16px; } /* evita zoom no iOS */
    .stage { background: #000; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
